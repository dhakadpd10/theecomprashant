name: Motion check - render the example motion reel
# Manual test of the motion-reel pipeline on GitHub's machines: voice, HyperFrames check, render, cover.
# Posts nothing and uses no Claude. The finished reel is attached to the run as "motion-check".
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the voice and speech-check models
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-models-v1
      - name: Browser for HyperFrames
        env:
          HYPERFRAMES_NO_TELEMETRY: "1"
        run: npx hyperframes browser ensure
      - name: Render content/posts/m01-five-questions
        run: node engine/motion.js content/posts/m01-five-questions
      - uses: actions/upload-artifact@v4
        with:
          name: motion-check
          path: |
            content/posts/m01-five-questions/reel.mp4
            content/posts/m01-five-questions/cover.jpg
