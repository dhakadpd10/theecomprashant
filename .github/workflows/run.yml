name: Run - post on time and answer the page
# One long job (about 5.5 hours) checks for due posts every minute and answers comments
# and DMs every 10 minutes. The hourly schedule keeps the next job queued, so there is
# always one running. (GitHub starts short scheduled jobs hours late, which made posts late.)
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: run-loop
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code (runs Claude on your subscription)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install the Claude SDK only
        run: npm install --prefix "$RUNNER_TEMP/sdk" @anthropic-ai/sdk@0.70.1 && echo "NODE_PATH=$RUNNER_TEMP/sdk/node_modules" >> "$GITHUB_ENV"
      - name: Post and answer for the next 5.5 hours
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/loop.sh
