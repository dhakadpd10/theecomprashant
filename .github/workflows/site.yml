name: Site - free tools page and media
# Publishes the free-tools page and the approved reels/slides to GitHub Pages,
# so keyword DMs have a link and Instagram's API can fetch the media.
on:
  push:
    branches: [main]
    paths: ["content/posts/**", "tools/**", "config/**", "src/site.js"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/cli.js site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
